{% extends 'base.html' %}

{% block title %} Stock Data Visualizer {% endblock %}

{% block content %}
    <h1>Stock Data Visualizer</h1>

    <form method="post" novalidate>
        <div class="form-group">
            <label for="symbol">Choose Symbol:</label>
            <select name="symbol" id="symbol">
                <option value="">Select a symbol</option>
                {% for stock in stocks %}
                    <option value="{{ stock['symbol'] }}" {% if form.get('symbol') == stock['symbol'] %}selected{% endif %}>{{ stock['symbol'] }} - {{ stock['name'] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="chart_type">Choose Chart Type:</label>
            <select name="chart_type" id="chart_type">
                <option value="">Select a chart type</option>
                {% for value, label in chart_types.items() %}
                    <option value="{{ value }}" {% if form.get('chart_type') == value %}selected{% endif %}>{{ value }}. {{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="time_series">Choose Time Series:</label>
            <select name="time_series" id="time_series">
                <option value="">Select a time series</option>
                {% for value, series in time_series.items() %}
                    <option value="{{ value }}" {% if form.get('time_series') == value %}selected{% endif %}>{{ value }}. {{ series['label'] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="start_date">Start Date:</label>
            <input type="date" name="start_date" id="start_date" value="{{ form.get('start_date', '') }}">
        </div>

        <div class="form-group">
            <label for="end_date">End Date:</label>
            <input type="date" name="end_date" id="end_date" value="{{ form.get('end_date', '') }}">
        </div>

        <div class="form-group">
            <button type="submit">Submit</button>
        </div>
    </form>

    {% if chart %}
        <div class="chart">
            <embed type="image/svg+xml" src="{{ chart|safe }}">
        </div>
    {% endif %}
{% endblock %}
